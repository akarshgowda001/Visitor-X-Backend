# Database - use Render MySQL/PlanetScale external DB
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Render injects PORT automatically
server.port=${PORT:8080}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT - store secret in Render env vars, never hardcode
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Disable Swagger in production (recommended)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true


# QR codes - use /tmp on Render (ephemeral filesystem)
app.qr.save-path=/tmp/qrcodes/
app.export.save-path=exports/
# Set your actual frontend URL
app.visitor.form-url=${FRONTEND_URL}
app.base-url=${BASE_URL}
